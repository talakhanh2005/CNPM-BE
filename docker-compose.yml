services:
  api:
    build: .
    env_file: .env
    environment:
      # Ghi đè giá trị trong .env: trong mạng compose Mongo ở host "mongo", app luôn nghe 8000.
      MONGO_URI: mongodb://mongo:27017/face_emotion
      # OpenEmotion chạy trên máy host; localhost trong container không phải máy host.
      AI_BASE_URL: "${AI_DOCKER_BASE_URL:-http://host.docker.internal:9000}"
      PORT: "8000"
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/face_emotion
      AI_BASE_URL: "${AI_DOCKER_BASE_URL:-http://host.docker.internal:9000}"
    # Dockerfile mặc định chạy API; worker cần entrypoint riêng.
    entrypoint: ["python", "-m", "app.worker"]
    # The image healthcheck targets the HTTP API; the worker intentionally has no HTTP port.
    healthcheck:
      disable: true
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1
    profiles: ["tools"]
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
