[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "face-emotion-backend"
version = "1.1.0"
description = "Online classroom signaling and emotion analysis gateway"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<2.1",
 "pydantic-settings>=2.6,<3", "pydantic[email]>=2.10,<3", "PyJWT>=2.10,<3",
 "bcrypt>=4.2,<6", "httpx>=0.28,<1", "alembic>=1.14,<2",
 "cloudinary>=1.42,<2", "pyodbc>=5.2,<6", "pillow>=11,<13", "pymongo>=4.10,<5"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mongomock>=4.3,<5"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
