[project]
name = "cnpm-be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Khanh-12-felix", email = "hathaikhanh0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "cloudinary>=1.44.1",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.10.1",
    "PyJWT>=2.10.1",
    "pymongo>=4.14.1",
    "pwdlib[argon2]>=0.2.1",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
]

[project.scripts]
cnpm-be = "cnpm_be:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"
